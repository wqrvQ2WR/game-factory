<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>게임 공장 — AI 제작기</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#08090d;color:#e9e9f2;
  font:14px/1.55 system-ui,-apple-system,sans-serif;overflow:hidden}
#app{display:flex;height:100%}
#side{width:400px;flex:none;overflow-y:auto;padding:18px;border-right:1px solid #ffffff14;background:#0b0c11}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#prev{flex:1;border:0;width:100%;background:#000}
#bar{flex:none;padding:11px 16px;border-top:1px solid #ffffff14;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0 0 2px}
.hint{color:#7c7f93;font-size:12px;margin:0 0 16px}
.sec{font-size:11px;letter-spacing:.12em;color:#7c8cff;margin:18px 0 7px;text-transform:uppercase;display:flex;justify-content:space-between}
.sec span{color:#5b5e73;letter-spacing:0;text-transform:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{padding:5px 11px;border-radius:99px;border:1px solid #ffffff1f;background:#141620;color:#a8abbd;
  font:12px system-ui;cursor:pointer}
.chips button.on{background:#7c8cff;color:#0b0c11;border-color:#7c8cff;font-weight:600}
.chips button:hover{border-color:#7c8cff}
select,input[type=text]{width:100%;padding:7px 9px;border-radius:8px;border:1px solid #ffffff1f;
  background:#141620;color:#e9e9f2;font:13px system-ui}
button.act{padding:9px 15px;border-radius:9px;border:1px solid #ffffff1f;background:#171922;color:#e9e9f2;
  font:600 13px system-ui;cursor:pointer}
button.act:hover:not(:disabled){border-color:#7c8cff}
button.act.pri{background:#7c8cff;color:#0b0c11;border-color:#7c8cff}
button.act:disabled{opacity:.45;cursor:default}
#log{margin-top:16px;font-size:12px;line-height:1.7;max-height:210px;overflow:auto;
  background:#0e1017;border:1px solid #ffffff12;border-radius:10px;padding:10px 12px}
#log div{display:flex;gap:7px}
#log .ok{color:#6ee7a5}#log .no{color:#ff7a86}#log .go{color:#7c8cff}#log .dim{color:#6e7186}
#warn{margin-top:10px;font-size:12px;color:#ffb86b}
#code{position:absolute;inset:0;background:#0b0c11e8;padding:24px;overflow:auto;display:none;z-index:9}
#code pre{white-space:pre-wrap;word-break:break-all;font:12px/1.5 ui-monospace,Menlo,monospace;color:#c9cbd8}
.stat{color:#7c7f93;font-size:12px}
</style>

<div id="app">
  <div id="side">
    <h1>AI 제작기</h1>
    <p class="hint">태그를 고르면 AI가 게임 코드를 통째로 씁니다. 만든 뒤 자동으로 돌려보고, 안 굴러가면 오류를 물려서 고치게 합니다.</p>

    <div id="groups"></div>

    <div class="sec">모델</div>
    <select id="model">
      <option value="auto/coding">auto/coding (기본)</option>
      <option value="auto/best-coding">auto/best-coding (느림·정확)</option>
      <option value="auto/smart">auto/smart</option>
      <option value="auto/fast">auto/fast (빠름·거침)</option>
      <option value="auto/claude-opus">auto/claude-opus</option>
    </select>

    <div class="sec">추가 주문 <span>선택</span></div>
    <input type="text" id="extra" placeholder="예: 보스가 3번 패턴을 바꾼다">

    <div id="warn"></div>
    <div id="log"></div>
  </div>

  <div id="main">
    <iframe id="prev" allow="autoplay"></iframe>
    <div id="bar">
      <button class="act pri" id="go">✨ 만들기</button>
      <button class="act" id="dice">🎲 태그 랜덤</button>
      <button class="act" id="dl" disabled>⬇ 내려받기</button>
      <button class="act" id="src" disabled>&lt;/&gt; 코드</button>
      <a class="act" href="./index.html" target="_blank" style="text-decoration:none">🗂 갤러리</a>
      <span class="stat" id="stat"></span>
    </div>
  </div>
</div>
<div id="code" onclick="this.style.display='none'"><pre id="codepre"></pre></div>

<script>
__TAGS__
const BASE = '__OMNIROUTE__';
</script>
<script>
const $ = (id) => document.getElementById(id);
const frame = $('prev');
let picked = new Set(), html = '', busy = false;

// ── 태그 UI ──
$('groups').innerHTML = TAG_GROUPS.map((g) => `
  <div class="sec">${g.name} <span>${g.req ? '필수' : '선택'} · 최대 ${g.pick}</span></div>
  <div class="chips" data-g="${g.key}">${g.tags.map((t) => `<button data-t="${t}">${t}</button>`).join('')}</div>`).join('');

$('groups').onclick = (e) => {
  const b = e.target.closest('button[data-t]');
  if (!b) return;
  const g = TAG_GROUPS.find((x) => x.key === b.parentElement.dataset.g);
  const t = b.dataset.t;
  if (picked.has(t)) picked.delete(t);
  else {
    const cur = g.tags.filter((x) => picked.has(x));
    if (cur.length >= g.pick) picked.delete(cur[0]);   // 꽉 찼으면 가장 먼저 고른 걸 밀어낸다
    picked.add(t);
  }
  paint();
};

function paint() {
  document.querySelectorAll('#groups button[data-t]').forEach((b) => b.classList.toggle('on', picked.has(b.dataset.t)));
  const bad = conflictsIn([...picked]);
  $('warn').textContent = bad.length ? '⚠ 서로 안 맞는 조합: ' + bad.join(', ') : '';
  const need = TAG_GROUPS.filter((g) => g.req && !g.tags.some((t) => picked.has(t))).map((g) => g.name);
  $('go').disabled = busy || need.length > 0;
  $('go').textContent = busy ? '만드는 중…' : need.length ? `${need.join('·')} 을 고르세요` : '✨ 만들기';
}

$('dice').onclick = () => { picked = new Set(randomTags()); paint(); };

// ── 로그 ──
function log(cls, msg) {
  const d = document.createElement('div');
  d.innerHTML = `<span class="${cls}">${cls === 'ok' ? '✓' : cls === 'no' ? '✗' : cls === 'go' ? '▶' : '·'}</span><span>${msg}</span>`;
  $('log').appendChild(d); $('log').scrollTop = 1e6;
}

// ── omniroute ──
async function ask(messages, model) {
  const r = await fetch(BASE + '/chat/completions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model, stream: false, temperature: 1, max_tokens: 16000, messages }),
  });
  const txt = await r.text();
  if (!r.ok) throw new Error(`omniroute ${r.status}: ${txt.slice(0, 120)}`);
  let j;
  try { j = JSON.parse(txt); } catch { throw new Error('omniroute 응답이 JSON이 아님'); }
  return { text: j.choices?.[0]?.message?.content || '', model: j.model || model };
}

function extractHtml(text) {
  const fence = text.match(/```(?:html)?\s*([\s\S]*?)```/i);
  const body = (fence ? fence[1] : text).trim();
  if (/<canvas|<!doctype|<html/i.test(body)) return body;
  return null;
}

// ── 검증: 진짜 브라우저에서 돌려본다 ──
const PROBE = `<script>(function(){var f=0,errs=[];
window.onerror=function(m,s,l,c){errs.push(String(m)+' @'+l+':'+c);return false;};
window.addEventListener('unhandledrejection',function(e){errs.push('promise: '+e.reason);});
var raf=window.requestAnimationFrame.bind(window);
window.requestAnimationFrame=function(cb){return raf(function(x){f++;try{cb(x);}catch(e){errs.push('loop: '+e.message);}});};
window.__probe=function(){return {frames:f,errs:errs};};})();<\/script>`;

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// 탭이 숨겨져 있으면 브라우저가 rAF를 멈춘다 → 멀쩡한 게임도 '루프가 안 돈다'로 잘못 판정된다.
// 그래서 '보이는 동안'만 시간을 센다.
function untilVisible() {
  if (!document.hidden) return Promise.resolve();
  log('dim', '탭이 숨겨져 검증을 멈춥니다 — 이 창을 다시 보면 이어집니다');
  return new Promise((r) => {
    const h = () => { if (!document.hidden) { document.removeEventListener('visibilitychange', h); r(); } };
    document.addEventListener('visibilitychange', h);
  });
}
async function activeWait(ms) {
  let left = ms;
  while (left > 0) {
    await untilVisible();
    const t0 = Date.now();
    await wait(Math.min(250, left));
    if (!document.hidden) left -= Date.now() - t0;
  }
}
const off = document.createElement('canvas');
off.width = 48; off.height = 27;
const octx = off.getContext('2d', { willReadFrequently: true });

function sample(cv) {
  try {
    octx.clearRect(0, 0, 48, 27);
    octx.drawImage(cv, 0, 0, 48, 27);
    return Array.from(octx.getImageData(0, 0, 48, 27).data);
  } catch { return null; }
}
const spread = (a) => { const m = a.reduce((s, v) => s + v, 0) / a.length; return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / a.length); };
const diff = (a, b) => a.reduce((s, v, i) => s + Math.abs(v - b[i]), 0) / a.length;

async function verify(page) {
  const opens = (page.match(/<script\b/gi) || []).length, closes = (page.match(/<\/script>/gi) || []).length;
  if (opens > closes) return '응답이 중간에 잘렸다 (script 태그가 닫히지 않음) — 더 짧고 단순한 코드로 다시 만들어라';
  await untilVisible();
  frame.srcdoc = PROBE + page;
  await activeWait(1800);
  const w = frame.contentWindow, d = frame.contentDocument;
  if (!w || !w.__probe) return '페이지가 아예 뜨지 않음 (HTML이 깨졌을 가능성)';
  let p = w.__probe();
  if (p.errs.length) return '실행 오류: ' + p.errs[0];
  const cv = d.querySelector('canvas');
  if (!cv) return '<canvas> 요소가 없음';
  if (p.frames < 20) return `애니메이션 루프가 돌지 않음 (1.8초에 ${p.frames}프레임)`;
  const a = sample(cv);
  if (!a) return '캔버스를 읽을 수 없음';
  if (spread(a) < 3) return '화면에 아무것도 그려지지 않음 (타이틀 화면이 비어 있음)';

  // 입력을 넣어 본다
  const r = cv.getBoundingClientRect();
  for (const code of ['Space', 'Enter', 'ArrowRight', 'KeyW', 'KeyD']) {
    w.dispatchEvent(new w.KeyboardEvent('keydown', { code, key: code === 'Space' ? ' ' : 'x', bubbles: true }));
    d.dispatchEvent(new w.KeyboardEvent('keydown', { code, key: code === 'Space' ? ' ' : 'x', bubbles: true }));
  }
  for (const type of ['pointerdown', 'mousedown', 'click', 'mousemove']) {
    try { cv.dispatchEvent(new w.MouseEvent(type, { bubbles: true, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 })); } catch {}
  }
  await activeWait(1600);
  p = w.__probe();
  if (p.errs.length) return '입력 후 오류: ' + p.errs[0];
  const b = sample(cv);
  if (b && diff(a, b) < 1.2) return '입력에도 화면이 전혀 변하지 않음 (게임이 시작되지 않음)';
  return null;   // 통과
}

// ── 갤러리에 저장 ──
// 브라우저는 파일을 못 쓴다. out/ 을 서빙하는 server/gallery.js 가 POST /save 를 받아 대신 써 준다.
async function saveToGallery(page, tags, model, attempts) {
  if (location.protocol === 'file:') {
    log('dim', 'file:// 로 열려 있어 자동 저장은 안 됩니다 — node server/gallery.js 로 띄우면 저장됩니다');
    return;
  }
  const title = (page.match(/<title>([^<]*)<\/title>/i)?.[1] || 'AI 게임').trim();
  try {
    const r = await fetch('/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ html: page, title, tags, model, attempts }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    log('ok', `갤러리에 저장됨 — ${title} (총 ${j.total}개)`);
  } catch (e) {
    log('no', `갤러리 저장 실패: ${e.message} · server/gallery.js 가 떠 있는지 확인하세요 (지금은 내려받기로만 보관됩니다)`);
  }
}

// ── 생성 루프 ──
$('go').onclick = async () => {
  if (busy) return;
  busy = true; paint();
  $('log').innerHTML = ''; $('dl').disabled = $('src').disabled = true; html = '';
  const model = $('model').value;
  const tags = [...picked];
  const extra = $('extra').value.trim();

  const user = `태그: ${tags.join(', ')}${extra ? `\n추가 주문: ${extra}` : ''}

위 태그를 전부 반영한 게임을 만들어라. 태그끼리 어울리게 하나의 컨셉으로 엮을 것.`;
  const messages = [{ role: 'system', content: SYSTEM_PROMPT }, { role: 'user', content: user }];

  const t0 = Date.now();
  try {
    for (let attempt = 0; attempt <= 2; attempt++) {
      log('go', attempt === 0 ? `AI에게 요청 (${model})` : `수정 요청 ${attempt}/2`);
      const { text, model: used } = await ask(messages, model);
      log('dim', `응답 ${(text.length / 1000).toFixed(1)}k자 · ${used}`);
      const page = extractHtml(text);
      if (!page) {
        log('no', 'HTML 코드블록을 찾지 못함');
        messages.push({ role: 'assistant', content: text.slice(0, 500) },
          { role: 'user', content: '```html 코드블록 하나로만, 파일 전체를 다시 내라.' });
        continue;
      }
      log('go', '실제로 돌려보는 중…');
      const bad = await verify(page);
      if (!bad) {
        html = page;
        log('ok', `완성 · ${((Date.now() - t0) / 1000).toFixed(1)}초 · ${(page.length / 1024).toFixed(1)}KB`);
        $('dl').disabled = $('src').disabled = false;
        $('stat').textContent = tags.join(' · ');
        await saveToGallery(page, tags, used, attempt + 1);
        break;
      }
      log('no', bad);
      if (attempt === 2) { log('no', '2번 고쳐도 안 됨. 태그를 바꾸거나 더 좋은 모델로 다시.'); break; }
      messages.push({ role: 'assistant', content: '```html\n' + page + '\n```' },
        { role: 'user', content: `그 파일을 브라우저에서 돌렸더니 이렇게 실패했다:\n\n${bad}\n\n원인을 고쳐서 전체 파일을 다시 \`\`\`html 코드블록 하나로 내라. 설명은 쓰지 마라.` });
    }
  } catch (e) {
    log('no', e.message);
  }
  busy = false; paint();
};

$('dl').onclick = () => {
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const m = html.match(/<title>([^<]*)<\/title>/i);
  a.download = ((m && m[1]) || 'ai-game').replace(/[^\p{L}\p{N}]+/gu, '-').slice(0, 40) + '.html';
  a.click(); URL.revokeObjectURL(a.href);
};
$('src').onclick = () => { $('codepre').textContent = html; $('code').style.display = 'block'; };

picked = new Set(randomTags());
paint();
log('dim', '태그를 고르고 «만들기» 를 누르세요');
</script>
